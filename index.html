<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Martina López Parafita — Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://i.ytimg.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="is-table">

  <!-- ── REVISTA ── -->
  <main class="mag" id="mag">

    <!-- Navegación de secciones (aparece una vez pasado el índice) -->
    <nav class="topnav" id="topnav" hidden>
      <div class="topnav__inner" id="topnavInner"><!-- pestañas inyectadas por JS --></div>
    </nav>

    <div class="book" id="book">
      <div class="book__stage" id="stage">
        <!-- páginas inyectadas por JS -->
      </div>
    </div>

    <p class="mag__hint">Tocá la revista para abrirla</p>
  </main>

  <!-- Flechas pegadas a la revista: fuera de .book, porque su transform
       (escala/mesa) convertiría al libro en el marco de referencia del fixed. -->
  <button class="ctrl ctrl--prev" id="navPrev" aria-label="Página anterior" hidden>&#8592;</button>
  <button class="ctrl ctrl--next" id="navNext" aria-label="Página siguiente" hidden>&#8594;</button>
  <button class="zoomout" id="zoomOut" hidden>Dejar en la mesa</button>

  <!-- ── DESPLIEGUE DE TRABAJO ── -->
  <section class="work" id="work" aria-hidden="true">
    <div class="work__bar">
      <div class="work__heading">
        <span class="work__eyebrow" id="workEyebrow"></span>
        <h2 class="work__title" id="workTitle"></h2>
        <span class="work__meta" id="workMeta"></span>
        <p class="work__desc" id="workDesc"></p>
      </div>
      <button class="work__close" id="workClose" aria-label="Cerrar">Volver a la revista &#10005;</button>
    </div>
    <div class="work__body" id="workBody"></div>
  </section>

  <!-- ── LIGHTBOX ── -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" id="lbClose" aria-label="Cerrar">&#10005;</button>
    <button class="lightbox__prev" id="lbPrev" aria-label="Anterior">&#8592;</button>
    <button class="lightbox__next" id="lbNext" aria-label="Siguiente">&#8594;</button>
    <div class="lightbox__media" id="lbMedia"></div>
    <p class="lightbox__caption" id="lbCaption"></p>
  </div>

  <!-- ── CV ── Se despliega por encima de la revista desde la página de contacto.
       Se muestra la página del PDF ya rasterizada (los visores de PDF embebidos
       fallan en iOS) y el botón descarga el PDF original. -->
  <section class="cv" id="cv" aria-hidden="true" aria-label="Curriculum Vitae">
    <!-- La hoja cae desde arriba y queda apoyada sobre la revista, apenas
         torcida. Al tocarla se acerca para leerla cómoda. -->
    <div class="cv__stage" id="cvStage">
      <div class="cv__sheet" id="cvSheet" role="button" tabindex="0" aria-label="Acercar el CV">
        <img class="cv__page" id="cvPage" alt="Curriculum Vitae de Martina López Parafita"
             data-src="assets/cv-1.jpg" width="1600" height="2263" />
      </div>
    </div>
    <div class="cv__bar">
      <a class="cv__btn cv__btn--dl" href="assets/cv-martina-lopez-parafita.pdf"
         download="CV - Martina Lopez Parafita.pdf">Descargar PDF &#8595;</a>
      <button class="cv__btn" id="cvClose">Volver a la revista &#10005;</button>
    </div>
  </section>

  <!-- ── CAJA DE CD ── La tapa del disco se abre acá, ampliada y en 3D: al
       tocarla gira y muestra el reverso; tocando fuera se cierra. -->
  <section class="disc" id="disc" aria-hidden="true" aria-label="Caja del disco">
    <div class="disc__stage" id="discStage">
      <!-- El contenedor hace la entrada; la caja sólo gira. Si la animación de
           entrada viviera en la caja, su estado final pisaría el giro. -->
      <div class="disc__holder">
      <div class="disc__case" id="discCase" role="button" tabindex="0"
           aria-label="Dar vuelta la caja del disco">
        <div class="disc__face disc__face--front">
          <img id="discFront" alt="Frente de la tapa del disco" />
        </div>
        <div class="disc__face disc__face--back">
          <img id="discBack" alt="Reverso de la tapa del disco" />
        </div>
      </div>
      </div>
    </div>
    <p class="disc__hint" id="discHint">Tocá la caja para darla vuelta</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
